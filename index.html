<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6aa8a6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Chimes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Chimes</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <canvas id="scene" aria-label="Wind chimes hanging in a soft breeze"></canvas>

      <button id="breezeToggle" class="breeze-btn" type="button" aria-pressed="false" aria-label="Toggle breeze">
        <svg class="breeze-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
          <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
          <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
        </svg>
      </button>

      <section class="control-dock" aria-label="Wind chime controls">
        <div class="title-block">
          <p class="kicker">Pocket wind chimes</p>
          <h1>Chimes</h1>
          <p id="statusText" class="status">Tap wake, then move gently.</p>
        </div>

        <div class="actions">
          <button id="startButton" class="button primary" type="button">Wake</button>
          <button id="testButton" class="button" type="button">Test</button>
        </div>

        <div class="controls">
          <label class="range-field" for="volumeControl">
            <span>Volume</span>
            <input id="volumeControl" type="range" min="0" max="1" value="0.76" step="0.01">
          </label>
          <label class="range-field" for="sensitivityControl">
            <span>Sensitivity</span>
            <input id="sensitivityControl" type="range" min="0" max="1" value="0.64" step="0.01">
          </label>
          <label class="select-field" for="keyControl">
            <span>Key</span>
            <select id="keyControl" class="select-input">
              <option value="pentatonic">Pentatonic</option>
              <option value="amazingGrace">Amazing Grace</option>
              <option value="minorPent">Minor</option>
              <option value="zenGarden">Zen Garden</option>
              <option value="original">Original</option>
            </select>
          </label>
        </div>

        <div class="motion-meter" aria-hidden="true">
          <span id="motionMeter"></span>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
